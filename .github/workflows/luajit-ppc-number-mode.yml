name: Compare LuaJIT's PowerPC number modes
on:
  push:
    branches: [qualification/luajit-ppc-interpreter]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'tamird/bazel-central-registry' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Compare the configured VM headers and PowerPC interpreter
        run: python3 -IB .github/luajit_ppc_number_mode.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: luajit-powerpc-interpreter
          path: ${{ runner.temp }}/luajit-ppc-results.json
          if-no-files-found: error

